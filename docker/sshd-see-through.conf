# Root is the intended RunPod administration account, but it may authenticate
# only with a configured public key.
AllowUsers root
AllowGroups root
PermitRootLogin prohibit-password
AuthenticationMethods publickey
PubkeyAuthentication yes
AuthorizedKeysFile /run/see-through/authorized_keys
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no
StrictModes yes

# Retain only local forwarding to the loopback web service. The permitted
# destination is generated separately because the web port is configurable.
AllowTcpForwarding local
AllowAgentForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitListen none
X11Forwarding no
PermitTunnel no
PermitUserEnvironment no

LoginGraceTime 30
MaxAuthTries 3
MaxSessions 4
ClientAliveInterval 60
ClientAliveCountMax 3
TCPKeepAlive no
LogLevel VERBOSE
PrintMotd no
PrintLastLog no
